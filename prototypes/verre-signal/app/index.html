<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23aabff2'/%3E%3Cstop offset='1' stop-color='%236db4a9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='16' fill='url(%23g)'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui' font-weight='800' font-size='16' fill='%230b1020'%3EL%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Thème et mode instantané posés avant le premier rendu (pas de flash) ; ?theme= prime sur le choix mémorisé.
      (() => {
        const p = new URLSearchParams(location.search);
        let t = p.get('theme');
        if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('leon-theme'); } catch {} }
        const h = document.documentElement;
        h.dataset.theme = t === 'light' ? 'light' : 'dark';
        if (p.get('instant') === '1') h.dataset.instant = '';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
